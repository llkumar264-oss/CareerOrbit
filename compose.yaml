services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careerorbit
      POSTGRES_USER: careerorbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U careerorbit"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://careerorbit:${POSTGRES_PASSWORD}@postgres/careerorbit
      STORAGE_DIR: /data/resumes
    ports: ["127.0.0.1:8000:8000"]
    volumes: [private-files:/data]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 12
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, app.worker]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://careerorbit:${POSTGRES_PASSWORD}@postgres/careerorbit
      STORAGE_DIR: /data/resumes
    volumes: [private-files:/data]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  private-files:
